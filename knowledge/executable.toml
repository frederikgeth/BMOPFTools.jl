schema_version = "0.1.0"

[[contract]]
id = "parallel_member_limit_preservation"
knowledge_ids = ["PSK-000001"]
title = "Parallel member-current-limit preservation"
entrypoint = "check_parallel_member_limit_preservation"
scope = "Scalar, fixed-linear, series-only parallel lines with an explicit source-member to target-aggregate mapping."
applicability = [
  "Every source member and the target aggregate connect the same scalar terminal pair, allowing reversed orientation.",
  "Every included line has a finite, nonzero scalar series impedance and no shunt model.",
  "Every source member and the target aggregate has a nonnegative scalar current rating.",
]
checked_dimensions = ["terminal_behavior", "scalar_member_current_limits"]
unassessed_dimensions = [
  "member_identity",
  "independent_outage_state",
  "switching_decisions",
  "asset_provenance",
  "individual_measurements",
  "protection_quantities",
]
finding_codes = [
  "E.CONTRACT.PARALLEL_TERMINAL_RELATION_MISMATCH",
  "W.CONTRACT.PARALLEL_MEMBER_LIMIT_LOSS",
  "I.CONTRACT.NOT_APPLICABLE",
  "W.CONTRACT.INDETERMINATE",
]
fixture_ids = ["parallel-rating-outer-relaxation-001"]
source_paths = [
  "src/knowledge/contracts.jl",
  "docs/src/findings.md",
  "test/scientific_contract_tests.jl",
]

[[finding]]
code = "E.CONTRACT.PARALLEL_TERMINAL_RELATION_MISMATCH"
severity = "ERROR"
meaning = "The declared target aggregate does not preserve the summed scalar source admittance."

[[finding]]
code = "W.CONTRACT.PARALLEL_MEMBER_LIMIT_LOSS"
severity = "WARNING"
meaning = "The target aggregate rating defines an inner restriction or outer relaxation of the source member-current-limit region."

[[finding]]
code = "I.CONTRACT.NOT_APPLICABLE"
severity = "INFO"
meaning = "The input lies outside the contract's declared scalar, fixed-linear, series-only domain."

[[finding]]
code = "W.CONTRACT.INDETERMINATE"
severity = "WARNING"
meaning = "Required mapped components or scalar ratings are unavailable, so preservation cannot be decided."

[[contract]]
id = "neutral_ground_reference_preservation"
knowledge_ids = ["PSK-000002"]
title = "Neutral, ground, and reference preservation"
entrypoint = "check_neutral_ground_reference_preservation"
scope = "Representation-level comparison of explicit neutral identity, neutral continuity, perfect grounding, scalar finite grounding shunts, and voltage-source reference incidence across an explicit bus mapping."
applicability = [
  "At least two source buses with identifiable explicit neutral terminals map one-to-one to target buses.",
  "Neutral continuity is represented by line, closed-switch, or single-phase-autotransformer terminal maps.",
  "Finite grounding is represented by resolvable scalar neutral-only shunts; coupled grounding models are outside this initial contract.",
]
checked_dimensions = ["neutral_terminal_identity", "neutral_continuity", "ground_reference_relations"]
unassessed_dimensions = [
  "electrical_terminal_behavior",
  "explicit_earth_conductor_behavior",
  "soil_and_electrode_model",
  "grounding_asset_identity_and_state",
  "fault_current",
  "touch_voltage",
  "protection_operation",
]
finding_codes = [
  "E.CONTRACT.NEUTRAL_IDENTITY_LOSS",
  "E.CONTRACT.NEUTRAL_CONTINUITY_MISMATCH",
  "E.CONTRACT.GROUND_REFERENCE_RELATION_MISMATCH",
  "I.CONTRACT.NEUTRAL_GROUND_NOT_APPLICABLE",
  "W.CONTRACT.NEUTRAL_GROUND_INDETERMINATE",
]
fixture_ids = ["neutral-ground-reference-conflation-001"]
source_paths = [
  "src/knowledge/contracts.jl",
  "docs/src/findings.md",
  "test/scientific_contract_tests.jl",
]

[[finding]]
code = "E.CONTRACT.NEUTRAL_IDENTITY_LOSS"
severity = "ERROR"
meaning = "A mapped target bus has no identifiable explicit neutral terminal, so the source neutral representation was discarded."

[[finding]]
code = "E.CONTRACT.NEUTRAL_CONTINUITY_MISMATCH"
severity = "ERROR"
meaning = "The target changes whether mapped bus neutrals are connected through declared neutral-carrying components."

[[finding]]
code = "E.CONTRACT.GROUND_REFERENCE_RELATION_MISMATCH"
severity = "ERROR"
meaning = "The target changes a mapped neutral's perfect-ground, finite-grounding, or voltage-source-reference relation."

[[finding]]
code = "I.CONTRACT.NEUTRAL_GROUND_NOT_APPLICABLE"
severity = "INFO"
meaning = "The input lies outside the contract's explicit-neutral and scalar neutral-only grounding domain."

[[finding]]
code = "W.CONTRACT.NEUTRAL_GROUND_INDETERMINATE"
severity = "WARNING"
meaning = "A mapped bus or resolvable grounding relation is unavailable, so preservation cannot be decided."

[[contract]]
id = "claimed_solution_validity"
knowledge_ids = ["PSK-000003"]
title = "Claimed-feasible solution validity"
entrypoint = "check_claimed_solution_validity"
scope = "Independent validation of a claimed-feasible result's complete bus-terminal numeric data and declared bus voltage-magnitude, sequence-voltage, and angle-difference limits."
applicability = [
  "The result declares LOCALLY_SOLVED, OPTIMAL, or ALMOST_LOCALLY_SOLVED.",
  "The network declares at least one bus terminal.",
  "The result provides numeric vr, vi, and vm fields for every declared bus terminal.",
]
checked_dimensions = [
  "termination_status",
  "result_numeric_finiteness",
  "declared_bus_voltage_and_angle_limits",
]
unassessed_dimensions = [
  "network_equation_residuals",
  "branch_thermal_limits",
  "transformer_limits",
  "generator_and_ibr_limits",
  "load_model_residuals",
  "network_power_balance",
  "objective_optimality",
  "local_or_global_optimality",
  "solver_derivative_quality",
]
finding_codes = [
  "E.CONTRACT.CLAIMED_FEASIBLE_SOLUTION_INVALID",
  "I.CONTRACT.SOLUTION_STATUS_NOT_APPLICABLE",
  "W.CONTRACT.SOLUTION_VALIDATION_INDETERMINATE",
]
fixture_ids = ["claimed-feasible-invalid-solution-001"]
source_paths = [
  "src/knowledge/contracts.jl",
  "src/validation/solution.jl",
  "docs/src/findings.md",
  "test/scientific_contract_tests.jl",
]

[[finding]]
code = "E.CONTRACT.CLAIMED_FEASIBLE_SOLUTION_INVALID"
severity = "ERROR"
meaning = "A result with a claimed-feasible termination status contains non-finite values or violates a declared bus voltage or angle limit under independent profiling."

[[finding]]
code = "I.CONTRACT.SOLUTION_STATUS_NOT_APPLICABLE"
severity = "INFO"
meaning = "The solver did not claim a feasible solution, or the network has no declared bus terminals, so the initial claimed-solution contract is not applicable."

[[finding]]
code = "W.CONTRACT.SOLUTION_VALIDATION_INDETERMINATE"
severity = "WARNING"
meaning = "Termination status or required bus-terminal result data is missing, so the implemented validation dimensions cannot be decided."

[[contract]]
id = "load_voltage_base_consistency"
knowledge_ids = ["PSK-000004"]
title = "Load connection voltage-base consistency"
entrypoint = "check_load_voltage_base_consistency"
scope = "Voltage-dependent WYE and DELTA loads with finite positive nominal anchors and source-reachable phase-to-neutral bus bases."
applicability = [
  "At least one selected load uses a voltage-dependent model and declares WYE or DELTA configuration.",
  "Every selected load has a finite positive scalar or per-subload v_nom.",
  "Every selected load bus has a nominal phase-to-neutral voltage reachable from a declared source through BMOPFTools voltage-level propagation.",
]
checked_dimensions = [
  "source_propagated_bus_voltage_base",
  "declared_load_connection_voltage_coordinate",
  "load_nominal_voltage_anchor",
]
unassessed_dimensions = [
  "source_voltage_declaration_correctness",
  "transformer_ratio_declaration_correctness",
  "terminal_map_correctness",
  "load_law_and_coefficient_correctness",
  "operating_voltage",
  "network_equation_feasibility",
  "equipment_limits",
  "unit_provenance",
]
finding_codes = [
  "E.CONTRACT.LOAD_VOLTAGE_BASE_MISMATCH",
  "I.CONTRACT.LOAD_VOLTAGE_BASE_NOT_APPLICABLE",
  "W.CONTRACT.LOAD_VOLTAGE_BASE_INDETERMINATE",
]
fixture_ids = ["load-voltage-base-mismatch-001"]
source_paths = [
  "src/knowledge/contracts.jl",
  "src/validation/domain_rules.jl",
  "docs/src/findings.md",
  "test/scientific_contract_tests.jl",
]

[[finding]]
code = "E.CONTRACT.LOAD_VOLTAGE_BASE_MISMATCH"
severity = "ERROR"
meaning = "A voltage-dependent load's nominal anchor lies outside the declared ratio band for its source-propagated WYE phase-to-neutral or DELTA line-to-line voltage base."

[[finding]]
code = "I.CONTRACT.LOAD_VOLTAGE_BASE_NOT_APPLICABLE"
severity = "INFO"
meaning = "No unique voltage-dependent WYE or DELTA load is selected, so the initial load voltage-base contract is not applicable."

[[finding]]
code = "W.CONTRACT.LOAD_VOLTAGE_BASE_INDETERMINATE"
severity = "WARNING"
meaning = "A selected load, numeric nominal anchor, or source-reachable bus voltage base is unavailable, so consistency cannot be decided."

[[contract]]
id = "transformer_tap_domain_preservation"
knowledge_ids = ["PSK-000005"]
title = "Adjustable transformer tap-domain preservation"
entrypoint = "check_transformer_tap_domain_preservation"
scope = "Continuous scalar tap intervals on explicitly mapped two-winding isolating transformers whose subtype and non-tap declarations are unchanged."
applicability = [
  "Source and target map one transformer with the same supported single_phase, center_tap, wye_delta, or delta_wye subtype.",
  "The source declares finite positive tap_min < tap_max and a tap start inside that continuous interval.",
  "All mapped non-tap transformer declarations are identical; target bounds may be explicit or omitted to represent a fixed tap singleton.",
]
checked_dimensions = [
  "mapped_transformer_base_factor_identity",
  "tap_start_admissibility",
  "continuous_tap_decision_domain",
]
unassessed_dimensions = [
  "pointwise_terminal_equations",
  "tap_dependent_leakage_or_excitation",
  "discrete_tap_positions",
  "mechanical_or_per_phase_coupling",
  "automatic_control_logic",
  "network_feasible_set",
  "objective_value",
  "optimal_tap",
  "solver_status_or_optimality",
]
finding_codes = [
  "E.CONTRACT.TRANSFORMER_TAP_DOMAIN_LOSS",
  "I.CONTRACT.TRANSFORMER_TAP_NOT_APPLICABLE",
  "W.CONTRACT.TRANSFORMER_TAP_INDETERMINATE",
]
fixture_ids = ["transformer-tap-domain-loss-001"]
source_paths = [
  "src/knowledge/contracts.jl",
  "docs/src/findings.md",
  "test/scientific_contract_tests.jl",
]

[[finding]]
code = "E.CONTRACT.TRANSFORMER_TAP_DOMAIN_LOSS"
severity = "ERROR"
meaning = "The target transformer tap interval differs from the mapped adjustable source interval, creating an inner restriction, outer extension, shifted overlap, or disjoint decision domain."

[[finding]]
code = "I.CONTRACT.TRANSFORMER_TAP_NOT_APPLICABLE"
severity = "INFO"
meaning = "The source is not an adjustable continuous transformer in the implemented domain, or mapped subtype and non-tap declarations differ."

[[finding]]
code = "W.CONTRACT.TRANSFORMER_TAP_INDETERMINATE"
severity = "WARNING"
meaning = "A mapped transformer, complete numeric tap interval, or admissible tap start is unavailable, so domain preservation cannot be decided."
