name: CI
on:
  push:
    branches:
      - main
      - release-*
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron:  '0 0 * * 3' # on every Wednesday
# needed to allow julia-actions/cache to delete old caches that it has created
permissions:
  actions: write
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/check_llms_entrypoint.py
      - run: python3 scripts/generate_finding_registry.py --check
      - run: python3 scripts/generate_executable_knowledge.py --check
      - run: python3 scripts/check_release_metadata.py

  installation:
    name: Fresh installation - ${{ matrix.julia }} - JuMP ${{ matrix.jump }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']
        jump: ['1.29.4', 'latest']
    env:
      JULIA_LOAD_PATH: '@:@stdlib'
      JULIA_PKG_PRECOMPILE_AUTO: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - run: julia --startup-file=no test/fresh_install.jl '${{ matrix.jump }}'

  test:
    env:
      BMOPF_REQUIRE_TEST_DEPS: "true"
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']   # literal compatibility floor and latest stable
        os: [ubuntu-latest]
        arch: [default]
    steps:
      - uses: actions/checkout@v6
      - name: Check machine-discovery entry point
        run: python3 scripts/check_llms_entrypoint.py
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  diffopt-integration:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: DiffOpt integration - Julia latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate isolated DiffOpt test environment
        run: >-
          julia --project=test/diffopt -e
          'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run DiffOpt integration tests
        run: julia --color=yes --project=test/diffopt test/diffopt/runtests.jl

  downstream-extension:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    name: Downstream extension package - Julia latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate downstream-package test environment
        run: >-
          julia --project=test/downstream -e
          'using Pkg; Pkg.develop([
          PackageSpec(path=pwd()),
          PackageSpec(path=joinpath(pwd(), "test", "fixtures", "MockOpfExtension"))]);
          Pkg.instantiate()'
      - name: Run downstream-package integration tests
        run: julia --color=yes --project=test/downstream test/downstream/runtests.jl
