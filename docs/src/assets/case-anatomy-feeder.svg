<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="300" rx="8" fill="#ffffff"/>
  <g stroke="#1f4e79" stroke-width="2" fill="none">
    <!-- phase conductors mv -->
    <path d="M70 70 H170 M70 100 H170 M70 130 H170"/>
    <!-- lv conductors -->
    <path d="M270 70 H690 M270 100 H690 M270 130 H690"/>
  </g>
  <path d="M270 170 H690" stroke="#b5651d" stroke-width="2" fill="none"/>
  <!-- source -->
  <circle cx="50" cy="100" r="22" fill="#eaf2fb" stroke="#1f4e79" stroke-width="2"/>
  <text x="50" y="105" text-anchor="middle" fill="#1f4e79">~</text>
  <text x="50" y="145" text-anchor="middle" fill="#333">grid</text>
  <!-- transformer -->
  <rect x="170" y="55" width="100" height="130" rx="6" fill="#f4f4f4" stroke="#555" stroke-width="2"/>
  <text x="220" y="112" text-anchor="middle" fill="#333">Δ : Y</text>
  <text x="220" y="130" text-anchor="middle" fill="#555" font-size="11">sub</text>
  <!-- buses -->
  <g fill="#333" text-anchor="middle" font-weight="bold">
    <text x="120" y="40">mv</text><text x="310" y="40">lv0</text><text x="470" y="40">lv1</text><text x="670" y="40">lv2</text>
  </g>
  <g stroke="#999" stroke-dasharray="4 3" stroke-width="1" fill="none">
    <rect x="100" y="50" width="40" height="95" rx="5"/>
    <rect x="290" y="50" width="40" height="135" rx="5"/>
    <rect x="450" y="50" width="40" height="135" rx="5"/>
    <rect x="650" y="50" width="40" height="135" rx="5"/>
  </g>
  <!-- terminals -->
  <g fill="#1f4e79">
    <circle cx="120" cy="70" r="4"/><circle cx="120" cy="100" r="4"/><circle cx="120" cy="130" r="4"/>
    <circle cx="310" cy="70" r="4"/><circle cx="310" cy="100" r="4"/><circle cx="310" cy="130" r="4"/>
    <circle cx="470" cy="70" r="4"/><circle cx="470" cy="100" r="4"/><circle cx="470" cy="130" r="4"/>
    <circle cx="670" cy="70" r="4"/><circle cx="670" cy="100" r="4"/><circle cx="670" cy="130" r="4"/>
  </g>
  <g fill="#b5651d"><circle cx="310" cy="170" r="4"/><circle cx="470" cy="170" r="4"/><circle cx="670" cy="170" r="4"/></g>
  <g fill="#555" font-size="11">
    <text x="78" y="66">a</text><text x="78" y="96">b</text><text x="78" y="126">c</text>
    <text x="700" y="74">a</text><text x="700" y="104">b</text><text x="700" y="134">c</text><text x="700" y="174" fill="#b5651d">n</text>
  </g>
  <!-- ground at lv0 -->
  <g stroke="#b5651d" stroke-width="2" fill="none">
    <path d="M310 170 V205 M296 205 H324 M301 211 H319 M306 217 H314"/>
  </g>
  <text x="310" y="238" text-anchor="middle" fill="#b5651d" font-size="11">neutral grounded here only</text>
  <!-- line labels -->
  <text x="390" y="92" text-anchor="middle" fill="#555" font-size="11">f1 · 120 m</text>
  <text x="570" y="92" text-anchor="middle" fill="#555" font-size="11">f2 · 150 m</text>
  <!-- loads -->
  <g stroke="#2e7d32" stroke-width="2" fill="none">
    <path d="M432 70 V205 M448 170 V205"/>
    <path d="M632 130 V205 M648 170 V205"/>
  </g>
  <g stroke="#2e7d32" stroke-width="2" fill="#e8f5e9">
    <rect x="424" y="205" width="32" height="30" rx="3"/>
    <rect x="624" y="205" width="32" height="30" rx="3"/>
  </g>
  <g fill="#2e7d32"><circle cx="432" cy="70" r="3"/><circle cx="448" cy="170" r="3"/><circle cx="632" cy="130" r="3"/><circle cx="648" cy="170" r="3"/></g>
  <text x="440" y="252" text-anchor="middle" fill="#2e7d32" font-size="11">house, a–n</text>
  <text x="640" y="252" text-anchor="middle" fill="#2e7d32" font-size="11">house, c–n</text>
  <text x="380" y="285" text-anchor="middle" fill="#555" font-size="12">Dashed boxes are buses: each one bundles several terminals. Blue: phase conductors. Brown: neutral.</text>
</svg>
