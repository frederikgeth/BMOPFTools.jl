<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="title desc">
<title id="title">Routes through the BMOPFTools documentation</title>
<desc id="desc">Start with a bundled case, understand network models, inspect and prepare cases, run studies, and verify results. Verification can return to case review. Advanced formulations and automation are optional branches. Reference and development support every stage.</desc>
