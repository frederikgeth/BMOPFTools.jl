<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="rarrow" markerWidth="9" markerHeight="9" refX="4" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>

  <text x="50"  y="26" fill="#333" font-weight="bold">source side (from)</text>
  <text x="452" y="26" fill="#333" font-weight="bold">regulated side (to)</text>
  <text x="248" y="26" fill="#555"><tspan font-style="italic">n</tspan><tspan dy="4" font-size="9">eff</tspan><tspan dy="-4"> : 1  (regulation ratio, tap &#8776; 1)</tspan></text>

  <!-- from leakage -->
  <circle cx="40" cy="110" r="4" fill="#111"/>
  <text x="18" y="103" fill="blue" font-style="italic">p</text>
  <line x1="40" y1="110" x2="62" y2="110" stroke="#111" stroke-width="1.6"/>
  <rect x="62" y="100" width="42" height="20" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="70" y="93" fill="#8a5a00"><tspan font-style="italic">R</tspan><tspan dy="-4" font-size="9">fr</tspan></text>
  <line x1="104" y1="110" x2="116" y2="110" stroke="#111" stroke-width="1.6"/>
  <path d="M116,110 A8,8 0 0 1 132,110 A8,8 0 0 1 148,110 A8,8 0 0 1 164,110" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="124" y="93" fill="#8a5a00"><tspan font-style="italic">X</tspan><tspan dy="-4" font-size="9">fr</tspan></text>
  <line x1="164" y1="110" x2="240" y2="110" stroke="#111" stroke-width="1.6"/>
  <circle cx="188" cy="110" r="3" fill="#111"/>

  <!-- no-load shunt on the FROM side -->
  <line x1="188" y1="110" x2="188" y2="130" stroke="#111" stroke-width="1.4"/>
  <line x1="170" y1="130" x2="206" y2="130" stroke="#111" stroke-width="1.4"/>
  <rect x="161" y="140" width="16" height="30" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="140" y="158" fill="#8a5a00"><tspan font-style="italic">G</tspan><tspan dy="4" font-size="9">0</tspan></text>
  <line x1="170" y1="130" x2="170" y2="140" stroke="#111" stroke-width="1.4"/>
  <line x1="170" y1="170" x2="170" y2="182" stroke="#111" stroke-width="1.4"/>
  <path d="M206,140 A6,6 0 0 1 206,152 A6,6 0 0 1 206,164 A6,6 0 0 1 206,176" fill="none" stroke="#111" stroke-width="1.7"/>
  <text x="212" y="160" fill="#8a5a00"><tspan font-style="italic">B</tspan><tspan dy="4" font-size="9">0</tspan></text>
  <line x1="206" y1="130" x2="206" y2="140" stroke="#111" stroke-width="1.4"/>
  <line x1="206" y1="176" x2="206" y2="182" stroke="#111" stroke-width="1.4"/>
  <line x1="170" y1="182" x2="206" y2="182" stroke="#111" stroke-width="1.4"/>
  <line x1="188" y1="182" x2="188" y2="210" stroke="#111" stroke-width="1.4"/>
  <text x="150" y="200" fill="#555" font-size="10.5"><tspan font-style="italic">Y</tspan><tspan dy="3" font-size="8">0</tspan><tspan dy="-3"> = </tspan><tspan font-style="italic">G</tspan><tspan dy="3" font-size="8">0</tspan><tspan dy="-3">+j</tspan><tspan font-style="italic">B</tspan><tspan dy="3" font-size="8">0</tspan></text>

  <!-- coupled coils + core -->
  <path d="M240,110 A15,15 0 0 0 240,140 A15,15 0 0 0 240,170 A15,15 0 0 0 240,210" fill="none" stroke="#111" stroke-width="2"/>
  <rect x="258" y="112" width="16" height="96" rx="2" fill="#ececec" stroke="#777" stroke-width="1.3"/>
  <path d="M292,110 A15,15 0 0 1 292,140 A15,15 0 0 1 292,170 A15,15 0 0 1 292,210" fill="none" stroke="#111" stroke-width="2"/>

  <!-- to leakage -->
  <line x1="292" y1="110" x2="330" y2="110" stroke="#111" stroke-width="1.6"/>
  <rect x="330" y="100" width="42" height="20" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="338" y="93" fill="#8a5a00"><tspan font-style="italic">R</tspan><tspan dy="-4" font-size="9">to</tspan></text>
  <line x1="372" y1="110" x2="384" y2="110" stroke="#111" stroke-width="1.6"/>
  <path d="M384,110 A8,8 0 0 1 400,110 A8,8 0 0 1 416,110 A8,8 0 0 1 432,110" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="392" y="93" fill="#8a5a00"><tspan font-style="italic">X</tspan><tspan dy="-4" font-size="9">to</tspan></text>
  <line x1="432" y1="110" x2="540" y2="110" stroke="#111" stroke-width="1.6"/>
  <circle cx="540" cy="110" r="4" fill="#111"/>
  <text x="548" y="103" fill="blue" font-style="italic">p</text>

  <!-- shared neutral bushing (galvanic bond): one continuous rail -->
  <line x1="40" y1="210" x2="540" y2="210" stroke="#111" stroke-width="1.8"/>
  <line x1="360" y1="210" x2="372" y2="210" stroke="#111" stroke-width="1.8" marker-end="url(#rarrow)"/>
  <circle cx="40" cy="210" r="4" fill="#111"/>
  <text x="20" y="228" fill="blue" font-style="italic">n</text>
  <circle cx="540" cy="210" r="4" fill="#111"/>
  <text x="548" y="215" fill="blue" font-style="italic">n</text>
  <path d="M240,222 L240,230 L540,230 L540,222" fill="none" stroke="#b06000" stroke-width="1.2"/>
  <text x="250" y="248" fill="#b06000" font-size="11">galvanic bond — shared neutral bushing: from &amp; to are one electrical node (not isolated)</text>

  <!-- short-circuit brace -->
  <path d="M62,268 L62,276 L432,276 L432,268" fill="none" stroke="#8a5a00" stroke-width="1.3"/>
  <line x1="247" y1="276" x2="247" y2="284" stroke="#8a5a00" stroke-width="1.3"/>
  <text x="120" y="300" fill="#8a5a00">short-circuit impedance &#160; <tspan font-style="italic">Z</tspan><tspan dy="4" font-size="9">sc</tspan><tspan dy="-4"> = </tspan><tspan font-style="italic">Z</tspan><tspan dy="-4" font-size="9">fr</tspan><tspan dy="4"> + </tspan><tspan font-style="italic">n</tspan><tspan dy="4" font-size="9">eff</tspan><tspan dy="-4">&#178;&#183;</tspan><tspan font-style="italic">Z</tspan><tspan dy="-4" font-size="9">to</tspan></text>
  <text x="120" y="316" fill="#555" font-size="10.5">no isolated secondary &#8594; no-load shunt on the FROM side; no internal winding neutral &#8594; no r/x_neutral branch</text>
</svg>
