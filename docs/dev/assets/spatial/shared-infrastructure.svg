<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">Shared location does not mean shared electrical node</title><desc id="desc">Two distinct voltage systems follow the same pole locations; transformer ports also share a physical location.</desc>
<style>text{font-family:system-ui,-apple-system,Arial,sans-serif;fill:#203348;font-size:16px}.title{font-size:24px;font-weight:650}.label{font-size:18px;font-weight:600}.small{font-size:14px}.muted{fill:#526477}</style>
<rect width="1000" height="430" rx="14" fill="#f5f8fc"/>
<text x="30" y="40" class="title">Shared location does not mean shared electrical node</text>
<text x="35" y="78" class="label">Map evidence</text>
<text x="520" y="78" class="label">Electrical model identities</text>
<line x1="100" y1="140" x2="100" y2="270" stroke="#a1aebc" stroke-width="9"/>
<text x="75" y="300" class="muted">pole</text>
<line x1="390" y1="140" x2="390" y2="270" stroke="#a1aebc" stroke-width="9"/>
<text x="365" y="300" class="muted">pole</text>
<line x1="100" y1="160" x2="390" y2="160" stroke="#215a91" stroke-width="5"/>
<line x1="100" y1="200" x2="390" y2="200" stroke="#b3622a" stroke-width="5"/>
<text x="205" y="144" class="">MV circuit</text>
<text x="205" y="230" class="">LV circuit</text>
<text x="35" y="335" class="small">Routes offset here for visibility.</text>
<text x="35" y="358" class="small">Their recorded coordinates may be identical.</text>
<line x1="570" y1="150" x2="890" y2="150" stroke="#215a91" stroke-width="3"/>
<circle cx="570" cy="150" r="7" fill="white" stroke="#215a91" stroke-width="3"/>
<text x="560" y="134" class="label">MV A</text>
<circle cx="890" cy="150" r="7" fill="white" stroke="#215a91" stroke-width="3"/>
<text x="880" y="134" class="label">MV B</text>
<line x1="570" y1="220" x2="890" y2="220" stroke="#b3622a" stroke-width="3"/>
<circle cx="570" cy="220" r="7" fill="white" stroke="#b3622a" stroke-width="3"/>
<text x="560" y="204" class="label">LV A</text>
<circle cx="890" cy="220" r="7" fill="white" stroke="#b3622a" stroke-width="3"/>
<text x="880" y="204" class="label">LV B</text>
<rect x="530" y="280" width="420" height="78" rx="8" fill="#fff" stroke="#d6e0ec"/>
<text x="545" y="305" class="small">Transformer ports may occupy one location.</text>
<text x="545" y="330" class="small">Distinct buses and winding maps remain distinct.</text>
<text x="35" y="402" class="label">Review cue: retain circuit IDs and voltage context; overlap alone requires no correction.</text>
</svg>
