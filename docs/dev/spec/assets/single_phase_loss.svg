<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <text x="60"  y="26" fill="#333" font-weight="bold">winding (from, HV primary)</text>
  <text x="450" y="26" fill="#333" font-weight="bold">winding (to, LV secondary)</text>
  <text x="256" y="26" fill="#555">ideal core &#160; <tspan font-style="italic">N</tspan> : 1</text>

  <!-- primary leakage -->
  <circle cx="40" cy="120" r="4" fill="#111"/>
  <text x="16" y="112" fill="blue" font-style="italic">p</text>
  <line x1="40" y1="120" x2="70" y2="120" stroke="#111" stroke-width="1.6"/>
  <rect x="70" y="110" width="44" height="20" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="78" y="103" fill="#8a5a00"><tspan font-style="italic">R</tspan><tspan dy="-4" font-size="9">fr</tspan></text>
  <line x1="114" y1="120" x2="126" y2="120" stroke="#111" stroke-width="1.6"/>
  <path d="M126,120 A8,8 0 0 1 142,120 A8,8 0 0 1 158,120 A8,8 0 0 1 174,120" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="134" y="103" fill="#8a5a00"><tspan font-style="italic">X</tspan><tspan dy="-4" font-size="9">fr</tspan></text>
  <line x1="174" y1="120" x2="230" y2="120" stroke="#111" stroke-width="1.6"/>

  <path d="M230,120 A15,15 0 0 0 230,150 A15,15 0 0 0 230,180 A15,15 0 0 0 230,210" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="230" y1="210" x2="40" y2="210" stroke="#111" stroke-width="1.6"/>
  <circle cx="40" cy="210" r="4" fill="#111"/>
  <text x="14" y="215" fill="blue" font-style="italic">n</text>

  <rect x="248" y="112" width="16" height="106" rx="2" fill="#ececec" stroke="#777" stroke-width="1.3"/>

  <path d="M282,120 A15,15 0 0 1 282,150 A15,15 0 0 1 282,180 A15,15 0 0 1 282,210" fill="none" stroke="#111" stroke-width="2"/>
  <line x1="282" y1="120" x2="330" y2="120" stroke="#111" stroke-width="1.6"/>
  <circle cx="330" cy="120" r="3" fill="#111"/>
  <line x1="282" y1="210" x2="330" y2="210" stroke="#111" stroke-width="1.6"/>
  <circle cx="330" cy="210" r="3" fill="#111"/>

  <!-- no-load shunt on secondary coil -->
  <line x1="330" y1="120" x2="330" y2="140" stroke="#111" stroke-width="1.4"/>
  <line x1="312" y1="140" x2="348" y2="140" stroke="#111" stroke-width="1.4"/>
  <rect x="303" y="150" width="18" height="34" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="280" y="146" fill="#8a5a00"><tspan font-style="italic">G</tspan><tspan dy="4" font-size="9">0</tspan></text>
  <line x1="312" y1="140" x2="312" y2="150" stroke="#111" stroke-width="1.4"/>
  <line x1="312" y1="184" x2="312" y2="196" stroke="#111" stroke-width="1.4"/>
  <path d="M348,150 A7,7 0 0 1 348,164 A7,7 0 0 1 348,178 A7,7 0 0 1 348,192" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="356" y="174" fill="#8a5a00"><tspan font-style="italic">B</tspan><tspan dy="4" font-size="9">0</tspan></text>
  <line x1="348" y1="140" x2="348" y2="150" stroke="#111" stroke-width="1.4"/>
  <line x1="348" y1="192" x2="348" y2="196" stroke="#111" stroke-width="1.4"/>
  <line x1="312" y1="196" x2="348" y2="196" stroke="#111" stroke-width="1.4"/>
  <line x1="330" y1="196" x2="330" y2="210" stroke="#111" stroke-width="1.4"/>
  <text x="284" y="230" fill="#555" font-size="11">no-load shunt <tspan font-style="italic">Y</tspan><tspan dy="3" font-size="8">0</tspan><tspan dy="-3"> = </tspan><tspan font-style="italic">G</tspan><tspan dy="3" font-size="8">0</tspan><tspan dy="-3"> + j</tspan><tspan font-style="italic">B</tspan><tspan dy="3" font-size="8">0</tspan></text>

  <!-- secondary leakage -->
  <line x1="330" y1="120" x2="378" y2="120" stroke="#111" stroke-width="1.6"/>
  <rect x="378" y="110" width="44" height="20" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="386" y="103" fill="#8a5a00"><tspan font-style="italic">R</tspan><tspan dy="-4" font-size="9">to</tspan></text>
  <line x1="422" y1="120" x2="434" y2="120" stroke="#111" stroke-width="1.6"/>
  <path d="M434,120 A8,8 0 0 1 450,120 A8,8 0 0 1 466,120 A8,8 0 0 1 482,120" fill="none" stroke="#111" stroke-width="1.8"/>
  <text x="442" y="103" fill="#8a5a00"><tspan font-style="italic">X</tspan><tspan dy="-4" font-size="9">to</tspan></text>
  <line x1="482" y1="120" x2="520" y2="120" stroke="#111" stroke-width="1.6"/>
  <circle cx="520" cy="120" r="4" fill="#111"/>
  <text x="528" y="112" fill="blue" font-style="italic">a</text>
  <line x1="330" y1="210" x2="520" y2="210" stroke="#111" stroke-width="1.6"/>
  <circle cx="520" cy="210" r="4" fill="#111"/>
  <text x="528" y="215" fill="blue" font-style="italic">n</text>

  <!-- neutral-grounding branch y_n (rneut/xneut) on the from-side neutral -->
  <line x1="150" y1="210" x2="150" y2="226" stroke="#111" stroke-width="1.4"/>
  <rect x="142" y="226" width="16" height="26" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <line x1="150" y1="252" x2="150" y2="262" stroke="#111" stroke-width="1.4"/>
  <line x1="138" y1="262" x2="162" y2="262" stroke="#111" stroke-width="1.5"/>
  <line x1="143" y1="266" x2="157" y2="266" stroke="#111" stroke-width="1.5"/>
  <line x1="147" y1="270" x2="153" y2="270" stroke="#111" stroke-width="1.5"/>
  <text x="163" y="245" fill="#8a5a00"><tspan font-style="italic">y</tspan><tspan dy="4" font-size="9">n</tspan></text>
  <text x="96" y="288" fill="#555" font-size="10.5">neutral grounding <tspan font-style="italic">y</tspan><tspan dy="3" font-size="8">n</tspan><tspan dy="-3"> = 1/(</tspan><tspan font-style="italic">R</tspan><tspan dy="3" font-size="8">n</tspan><tspan dy="-3">+j</tspan><tspan font-style="italic">X</tspan><tspan dy="3" font-size="8">n</tspan><tspan dy="-3">), optional (rneut/xneut)</tspan></text>

  <!-- short-circuit brace -->
  <path d="M70,304 L70,312 L482,312 L482,304" fill="none" stroke="#8a5a00" stroke-width="1.3"/>
  <line x1="276" y1="312" x2="276" y2="320" stroke="#8a5a00" stroke-width="1.3"/>
  <text x="158" y="338" fill="#8a5a00">short-circuit impedance &#160; <tspan font-style="italic">Z</tspan><tspan dy="4" font-size="9">sc</tspan><tspan dy="-4"> = </tspan><tspan font-style="italic">Z</tspan><tspan dy="-4" font-size="9">fr</tspan><tspan dy="4"> + </tspan><tspan font-style="italic">N</tspan><tspan dy="-4" font-size="9">2</tspan><tspan dy="4">&#183;</tspan><tspan font-style="italic">Z</tspan><tspan dy="-4" font-size="9">to</tspan></text>
  <text x="158" y="354" fill="#555" font-size="11">(the two winding leakages in series; what a short-circuit test measures)</text>
</svg>
